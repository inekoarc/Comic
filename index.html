<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="assets/favicon.ico?v=1" type="image/x-icon">
    <title>Comic</title>
    <link rel="stylesheet" href="styles.css?v=20260730-2">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#home" aria-label="Comic 首页">
          <img class="brand-mark" src="assets/favicon.ico?v=1" alt="">
        </a>

        <form class="header-search" id="headerSearch">
          <input id="searchInput" type="search" placeholder="搜索漫画名、标签">
          <button type="submit">搜索</button>
        </form>

        <button class="icon-button" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">☀</button>
        <button class="settings-button" id="settingsToggle" type="button" aria-expanded="false" aria-controls="libraryConfig">设置</button>
      </div>

      <nav class="main-nav" aria-label="主导航">
        <a href="#home" data-view-link="home">首页</a>
        <a href="#library" data-view-link="library">漫画库</a>
        <a href="#ranking" data-view-link="ranking">排行榜</a>
        <a href="#categories" data-view-link="categories">分类</a>
      </nav>
    </header>

    <div class="global-sync-progress" id="globalSyncProgress" role="status" aria-live="polite" hidden>
      <div class="global-sync-copy">
        <strong id="globalSyncProgressLabel">扫描漫画文件</strong>
        <span id="globalSyncProgressValue">0%</span>
      </div>
      <progress id="globalSyncProgressBar" max="100" value="0" aria-labelledby="globalSyncProgressLabel"></progress>
      <p id="globalSyncProgressDetail">正在处理漫画目录...</p>
    </div>

    <main>
      <section class="library-config directory-manager" id="libraryConfig" hidden>
        <div class="library-config-head directory-manager-head">
          <div>
            <strong>&#x76ee;&#x5f55;&#x7ba1;&#x7406;</strong>
            <span id="rootCountLabel">0 &#x4e2a;&#x76ee;&#x5f55;</span>
          </div>
          <div class="directory-manager-actions">
            <button class="secondary-button directory-action-button" id="syncLibraryButton" type="button">&#x540c;&#x6b65;&#x5237;&#x65b0;</button>
            <button class="primary-button directory-action-button" type="submit" form="pathForm">&#x6dfb;&#x52a0;&#x76ee;&#x5f55;</button>
          </div>
        </div>
        <form class="path-form directory-add-form" id="pathForm">
          <label>
            <span>&#x6279;&#x91cf;&#x6dfb;&#x52a0;&#x76ee;&#x5f55;</span>
            <input id="libraryPath" type="text" placeholder="&#x7559;&#x7a7a;&#x6253;&#x5f00;&#x9009;&#x62e9;&#x5668;&#xff0c;&#x6216;&#x7c98;&#x8d34;&#x591a;&#x4e2a;&#x8def;&#x5f84;&#xff1a;L:\Comic\&#x4e8c;&#x6e38;&#xff1b;L:\Comic\&#x7eaf;&#x7231;">
          </label>
        </form>
        <div class="root-list directory-list" id="rootList"></div>
        <div class="sync-progress" id="syncProgress" hidden>
          <div class="sync-progress-heading">
            <strong id="syncProgressLabel">&#x51c6;&#x5907;&#x540c;&#x6b65;</strong>
            <span id="syncProgressValue">0%</span>
          </div>
          <progress id="syncProgressBar" max="100" value="0" aria-labelledby="syncProgressLabel"></progress>
          <p id="syncProgressDetail">&#x6b63;&#x5728;&#x51c6;&#x5907;&#x5206;&#x7c7b;&#x76ee;&#x5f55;...</p>
        </div>
      </section>

      <section class="page-view active" id="homeView">
        <div class="home-recommendations" id="homeRecommendations"></div>
      </section>
      <section class="page-view" id="libraryView">
        <div class="section-title">
          <h1>漫画库</h1>
          <span id="resultCount">0 本漫画</span>
        </div>
        <div class="filter-bar" id="tagFilters"></div>
        <div class="filter-bar page-range-filter" id="pageRangeFilters" hidden></div>
        <div class="directory-grid" id="comicGrid"></div>
        <nav class="library-pager" id="libraryPager" aria-label="漫画库分页"></nav>
      </section>

      <section class="page-view" id="rankingView">
        <div class="section-title">
          <h1>排行榜</h1>
          <div class="ranking-tabs" id="rankingTabs">
            <button type="button" class="active" data-ranking-mode="rating">按评分</button>
            <button type="button" data-ranking-mode="views">按观看次数</button>
          </div>
        </div>
        <ol class="ranking-list" id="rankingList"></ol>
      </section>

      <section class="page-view" id="categoriesView">
        <div class="section-title">
          <h1>分类</h1>
          <span>标签来自每本漫画详情页</span>
        </div>
        <div class="category-board" id="categoryBoard"></div>
      </section>

      <section class="page-view" id="detailView">
        <div class="detail-layout" id="comicDetail"></div>
      </section>

      <section class="page-view" id="readerView">
        <div class="slide-reader" id="slideReader">
          <div class="reader-topbar" id="readerTopbar">
            <a class="reader-pill" href="#detail">‹ 返回</a>
            <button class="reader-pill reader-delete-button" id="deleteComicButton" type="button" popovertarget="readerDeleteModal">删除</button>
            <button class="reader-pill reader-delete-page-button" id="deletePageButton" type="button" popovertarget="readerDeletePageModal" title="删除当前阅读页">删页</button>
            <button class="reader-pill reader-move-button" id="moveComicButton" type="button" popovertarget="readerMoveModal">移动</button>
            <button class="reader-pill reader-neighbor-button" id="prevComicButton" type="button" title="切换到上一部漫画">上一部</button>
            <button class="reader-pill reader-neighbor-button" id="nextComicButton" type="button" title="切换到下一部漫画">下一部</button>
            <div class="reader-spacer"></div>
            <div class="reader-auto-control">
              <button class="reader-pill" id="autoToggle" type="button">自动：关</button>
              <div class="auto-popover" id="autoPopover" hidden>
                <input id="autoInterval" class="auto-slider" type="range" min="1" max="30" value="10">
              </div>
            </div>
            <div class="reader-key-speed-control" id="keySpeedControl">
              <button class="reader-pill" id="keySpeedToggle" type="button" title="调整方向键滚动速度">键速</button>
              <div class="key-speed-popover" id="keySpeedPopover" hidden>
                <output id="keySpeedValue" for="keySpeedRange">850 px/s</output>
                <input class="key-speed-slider" id="keySpeedRange" type="range" min="200" max="1800" step="50" value="850" aria-label="方向键滚动速度">
              </div>
            </div>
            <button class="reader-pill reader-icon" id="readerThemeToggle" type="button" aria-label="切换日夜">☀</button>
            <button class="reader-pill" id="fitToggle" type="button">自适应</button>
            <label class="reader-pill reader-width" id="widthControl">
              <span>宽度</span>
              <input id="imageWidth" type="range" min="40" max="100" value="100">
            </label>
            <div class="reader-mode-group" role="group" aria-label="阅读模式">
              <button type="button" data-reader-mode="scroll">下拉</button>
              <button type="button" data-reader-mode="single">单页</button>
            </div>
          </div>
          <div class="reader-stage" id="readerStage">
            <p class="empty-state">从漫画库选择一本漫画开始阅读。</p>
          </div>
          <div class="reader-page-badge" aria-label="阅读进度">
            <span id="progressLabel">0 / 0</span>
            <div><i id="progressBar"></i></div>
          </div>
          <div class="reader-complete-toast" id="readerCompleteToast" role="status" aria-live="polite" hidden>漫画已阅读完</div>
          <div class="reader-delete-modal" id="readerDeleteModal" role="dialog" aria-modal="true" aria-labelledby="readerDeleteTitle" popover="manual">
            <button class="reader-delete-backdrop" type="button" data-delete-cancel popovertarget="readerDeleteModal" popovertargetaction="hide" aria-label="取消删除"></button>
            <section class="reader-delete-dialog">
              <span>永久删除本地文件</span>
              <h2 id="readerDeleteTitle">确认删除这部漫画？</h2>
              <p id="readerDeleteName"></p>
              <div>
                <button class="reader-delete-cancel" type="button" data-delete-cancel popovertarget="readerDeleteModal" popovertargetaction="hide">取消</button>
                <button class="reader-delete-confirm" id="confirmDeleteComicButton" type="button">永久删除</button>
              </div>
            </section>
          </div>
          <div class="reader-delete-modal" id="readerDeletePageModal" role="dialog" aria-modal="true" aria-labelledby="readerDeletePageTitle" popover="manual">
            <button class="reader-delete-backdrop" type="button" data-delete-page-cancel popovertarget="readerDeletePageModal" popovertargetaction="hide" aria-label="取消删除当前页"></button>
            <section class="reader-delete-dialog">
              <span>永久删除本地图片</span>
              <h2 id="readerDeletePageTitle">确认删除当前阅读页？</h2>
              <p id="readerDeletePageName"></p>
              <div>
                <button class="reader-delete-cancel" type="button" data-delete-page-cancel popovertarget="readerDeletePageModal" popovertargetaction="hide">取消</button>
                <button class="reader-delete-confirm" id="confirmDeletePageButton" type="button">永久删除此页</button>
              </div>
            </section>
          </div>
          <select id="pageSelect" class="reader-hidden-select" aria-label="选择页码"></select>
          <select id="readingMode" class="reader-hidden-select" aria-label="阅读模式">
            <option value="scroll">下拉</option>
            <option value="single">单页</option>
          </select>
          <input id="brightness" class="reader-hidden-select" type="range" min="70" max="115" value="100">
        </div>
      </section>
      <div class="reader-delete-modal reader-move-modal" id="readerMoveModal" role="dialog" aria-modal="true" aria-labelledby="readerMoveTitle" popover="manual">
        <button class="reader-delete-backdrop" type="button" data-move-cancel popovertarget="readerMoveModal" popovertargetaction="hide" aria-label="取消移动漫画"></button>
        <section class="reader-delete-dialog">
          <span>移动本地文件夹</span>
          <h2 id="readerMoveTitle">移动这部漫画？</h2>
          <p id="readerMoveName"></p>
          <label class="reader-move-field">
            <span>目标分类</span>
            <select id="moveCategorySelect"></select>
          </label>
          <p class="reader-move-status" id="readerMoveStatus" role="status" aria-live="polite"></p>
          <div>
            <button class="reader-delete-cancel" type="button" data-move-cancel popovertarget="readerMoveModal" popovertargetaction="hide">取消</button>
            <button class="reader-move-confirm" id="confirmMoveComicButton" type="button">移动漫画</button>
          </div>
        </section>
      </div>
    </main>

    <script src="app.js?v=20260730-2"></script>
  </body>
</html>
